<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d0a">
  <title>Toolbox | Terminal Hero</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --terminal-green: #39ff85;
      --terminal-dim: #729b80;
      --terminal-bg: #080d0a;
      --panel: #050a07ef;
      --line: #39ff8530;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 38px 22px;
      background:
        radial-gradient(ellipse at 50% 0%, #14251a 0%, var(--terminal-bg) 68%);
      color: #e4f5e9;
      font-family: 'JetBrains Mono', monospace;
    }

    body::before {
      position: fixed;
      z-index: -1;
      inset: 0;
      background-image:
        linear-gradient(#39ff8508 1px, transparent 1px),
        linear-gradient(90deg, #39ff8508 1px, transparent 1px);
      background-size: 40px 40px;
      content: '';
      pointer-events: none;
    }

    body::after {
      position: fixed;
      z-index: 5;
      top: var(--pointer-y, -300px);
      left: var(--pointer-x, -300px);
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, #39ff8526 0%, #39ff8510 35%, transparent 70%);
      content: '';
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: opacity 180ms ease;
    }

    body.pointer-active::after { opacity: 1; }

    .terminal-window {
      width: min(1120px, 100%);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid #39ff8540;
      border-radius: 10px;
      background: var(--panel);
      box-shadow: 0 0 40px #39ff8510, 0 0 100px #39ff8508;
    }

    .terminal-header {
      display: flex;
      min-height: 48px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 20px;
      border-bottom: 1px solid #39ff8525;
      background: #17231b;
    }

    .terminal-dots { display: flex; gap: 8px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .red { background: #ff5f56; }
    .yellow { background: #ffbd2e; }
    .green { background: #27c93f; }
    .terminal-title { color: var(--terminal-dim); font-size: 12px; }
    .prompt { color: var(--terminal-green); }

    main { padding: clamp(26px, 5vw, 56px); }

    .command-line {
      margin: 0 0 12px;
      color: var(--terminal-dim);
      font-size: 13px;
    }

    h1 {
      margin: 0;
      color: var(--terminal-green);
      font-size: clamp(30px, 6vw, 56px);
      line-height: 1.1;
      text-shadow: 0 0 18px #39ff8538;
    }

    .intro {
      max-width: 690px;
      margin: 16px 0 30px;
      color: #a3b8a9;
      font-size: 14px;
      line-height: 1.8;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .tool-count, .status { color: var(--terminal-dim); font-size: 12px; }
    .status { white-space: nowrap; }
    .status[data-state="error"] { color: #ff8f86; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .search {
      width: min(330px, 58%);
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 4px;
      outline: none;
      background: #080e0a;
      color: #e4f5e9;
      font: inherit;
      font-size: 12px;
    }

    .search::placeholder { color: #729b8090; }
    .search:focus { border-color: var(--terminal-green); box-shadow: 0 0 0 2px #39ff8517; }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .tool-card {
      display: flex;
      min-height: 210px;
      flex-direction: column;
      padding: 19px;
      border: 1px solid #39ff8528;
      border-radius: 6px;
      background: linear-gradient(145deg, #102017a8, #080e0a);
      transition: border-color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
    }

    .tool-card:hover {
      transform: translateY(-3px);
      border-color: #39ff8580;
      box-shadow: 0 8px 28px #0008, 0 0 20px #39ff850d;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--terminal-dim);
      font-size: 10px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .tool-card h2 {
      margin: 18px 0 9px;
      color: var(--terminal-green);
      font-size: 17px;
      line-height: 1.35;
    }

    .tool-card p {
      margin: 0 0 20px;
      color: #a3b8a9;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.6;
    }

    .tool-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: auto;
      color: var(--terminal-green);
      font-size: 12px;
      text-decoration: none;
    }

    .tool-link:hover { text-decoration: underline; text-underline-offset: 4px; }
    .empty-state { grid-column: 1 / -1; padding: 28px 8px; color: var(--terminal-dim); font-size: 13px; }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 28px;
      padding-top: 17px;
      border-top: 1px solid #39ff8525;
      color: var(--terminal-dim);
      font-size: 10px;
    }

    @media (max-width: 850px) {
      .tool-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      body { padding: 14px 10px; }
      .terminal-header { padding: 11px 13px; }
      .terminal-title { font-size: 10px; }
      main { padding: 27px 17px; }
      .tool-grid { grid-template-columns: 1fr; }
      .tool-card { min-height: 190px; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .search { width: 100%; }
      footer { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="terminal-window">
    <header class="terminal-header">
      <div class="terminal-dots" aria-hidden="true">
        <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
      </div>
      <div class="terminal-title">bobby@linux: ~/toolbox</div>
      <div class="terminal-title">TOOLS</div>
    </header>

    <main>
      <p class="command-line"><span class="prompt">bobby@linux</span>:<span class="prompt">~/toolbox</span>$ ./list-tools.sh</p>
      <h1>Toolbox<span class="prompt">_</span></h1>
      <p class="intro"><span class="prompt">[ SYSTEM ]</span> A collection of small, useful tools for building, writing, and getting things done. Pick a tool to launch it.</p>

      <div class="toolbar">
        <div id="tool-count" class="tool-count" aria-live="polite">Loading tools…</div>
        <label class="sr-only" for="search">Search tools</label>
        <input class="search" id="search" type="search" placeholder="Search tools…" autocomplete="off">
      </div>

      <section id="tool-grid" class="tool-grid" aria-label="Available tools" aria-live="polite">
        <div class="empty-state">Reading toolbox/tools.json…</div>
      </section>

      <footer>
        <span><span class="prompt">●</span> TOOLBOX ONLINE</span>
        <span id="status" class="status" role="status">Loading catalog</span>
      </footer>
    </main>
  </div>

  <script>
    const grid = document.getElementById('tool-grid');
    const search = document.getElementById('search');
    const count = document.getElementById('tool-count');
    const status = document.getElementById('status');
    let tools = [];

    function makeText(tag, className, value) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = value;
      return element;
    }

    function renderTools() {
      const query = search.value.trim().toLocaleLowerCase();
      const matches = tools.filter((tool) =>
        [tool.name, tool.description, tool.id, tool.version]
          .some((value) => String(value || '').toLocaleLowerCase().includes(query))
      );

      count.textContent = `${matches.length} ${matches.length === 1 ? 'tool' : 'tools'} available`;
      grid.replaceChildren();

      if (!matches.length) {
        grid.append(makeText('p', 'empty-state', tools.length ? 'No tools match your search.' : 'No tools are listed in the catalog yet.'));
        return;
      }

      for (const tool of matches) {
        const card = document.createElement('article');
        card.className = 'tool-card';

        const meta = document.createElement('div');
        meta.className = 'card-meta';
        meta.append(makeText('span', '', `TOOL ${tool.id || '—'}`));
        meta.append(makeText('span', '', `v${tool.version || '—'}`));

        card.append(meta, makeText('h2', '', tool.name || 'Untitled tool'));
        card.append(makeText('p', '', tool.description || 'No description provided.'));

        if (tool.url) {
          const link = document.createElement('a');
          link.className = 'tool-link';
          link.href = tool.url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.append(document.createTextNode('Launch tool'));
          const arrow = makeText('span', '', '↗');
          arrow.setAttribute('aria-hidden', 'true');
          link.append(arrow);
          card.append(link);
        }

        grid.append(card);
      }
    }

    async function loadTools() {
      try {
        const response = await fetch('./tools.json');
        if (!response.ok) throw new Error(`Catalog request failed (${response.status})`);
        const catalog = await response.json();
        if (!catalog || !Array.isArray(catalog.tools)) throw new Error('Catalog must contain a tools array');
        tools = catalog.tools;
        renderTools();
        status.textContent = 'Catalog loaded';
        status.dataset.state = 'ready';
      } catch (error) {
        grid.replaceChildren(makeText('p', 'empty-state', 'Could not load tools.json. Open this dashboard through a local or hosted web server.'));
        count.textContent = 'Catalog unavailable';
        status.textContent = 'Catalog error';
        status.dataset.state = 'error';
        console.error(error);
      }
    }

    search.addEventListener('input', renderTools);
    loadTools();

    document.addEventListener('pointermove', (event) => {
      document.body.style.setProperty('--pointer-x', `${event.clientX}px`);
      document.body.style.setProperty('--pointer-y', `${event.clientY}px`);
      document.body.classList.add('pointer-active');
    });
    document.addEventListener('pointerleave', () => document.body.classList.remove('pointer-active'));
  </script>
</body>
</html>
